name: Renovate

on:
  # Runs several times a day so open PRs get rebased and merged promptly.
  # New update PRs are still only opened weekly (see "schedule" in renovate.json).
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate dependency updates
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
